#mn-catalog-ideas .mn-search{flex:1 1 200px;min-width:0;display:flex;gap:8px;align-items:center;padding:0 12px;border:1px solid var(--mn-line);border-radius:var(--mn-radius);height:44px}

#mn-catalog-ideas .mn-product svg{width:17px;height:17px;flex-shrink:0}

#mn-catalog-ideas .mn-sort{position:relative;display:flex;align-items:center;gap:7px;flex:0 0 174px;min-width:0;border:1px solid var(--mn-line);border-radius:var(--mn-radius);height:44px;padding-left:10px}

  if(sort!=='featured')matches.sort((a,b)=>sort==='asc'?a.price-b.price:b.price-a.price);
  const count=matches.length;
  const word=count%10===1&&count%100!==11?'товар':count%10>=2&&count%10<=4&&(count%100<12||count%100>14)?'товара':'товаров';
  panel.querySelector('.mn-count').textContent=`${count} ${word}`;
  const button=panel.querySelector('.mn-category span');
  if(button)button.textContent=cats.find(c=>c[0]===category)[1];
  panel.querySelectorAll('[data-category]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.category===category)));
  const more=panel.querySelector('.mn-more');
  if(more){const isMore=!['all','nuts','dried-fruit'].includes(category);more.setAttribute('aria-pressed',String(isMore));if(isMore)panel.querySelector('.mn-count').textContent=cats.find(c=>c[0]===category)[1]+' · '+count+' '+word;}
  panel.querySelector('.mn-products').innerHTML=matches.slice(0,3).map(p=>`<article class="mn-card">${photos[p.id]?`<img src="${photos[p.id]}" alt="${escape(p.title)}">`:`<div class="mn-photo-empty">${escape(cats.find(c=>c[0]===p.category)[1])}</div>`}<h3>${escape(p.title)}</h3><p>${money.format(p.price)} ₽ <small>/ ${escape(p.weight)}</small></p></article>`).join('')||'<p class="mn-empty">Товары не найдены</p>';
 }
 for(const [index,panel] of panels.entries()){
  const list=panel.querySelector('.mn-category-panel');
  list.id='mn-category-panel-'+index;
  list.innerHTML=cats.map(([id,name])=>`<button class="cursor-interaction" type="button" data-category="${id}" aria-pressed="false"><span>${escape(name)}</span><small>${id==='all'?data.length:data.filter(p=>p.category===id).length}</small></button>`).join('');
  const trigger=panel.querySelector('.mn-category,.mn-more');
  trigger.setAttribute('aria-controls',list.id);
  trigger.addEventListener('click',()=>{list.hidden=!list.hidden;trigger.setAttribute('aria-expanded',String(!list.hidden));});
  panel.addEventListener('keydown',e=>{if(e.key==='Escape'&&!list.hidden){list.hidden=true;trigger.setAttribute('aria-expanded','false');trigger.focus();}});
  panel.addEventListener('click',e=>{const b=e.target.closest('[data-category]');if(!b)return;state.selections[panel.dataset.layout]=b.dataset.category;list.hidden=true;trigger.setAttribute('aria-expanded','false');render(panel);if(list.contains(b))trigger.focus();persist();});
  panel.querySelector('input').addEventListener('input',()=>render(panel));
  panel.querySelector('select').addEventListener('change',()=>render(panel));
  render(panel);
  if(globalThis.Tweak){const design={radius:8};const tweak=new Tweak({container:panel,onChange:()=>panel.style.setProperty('--mn-radius',`${design.radius}px`)});tweak.addSlider(design,'radius',{label:'Скругление кнопок',min:0,max:18,unit:'px'});}
 }
 root.querySelectorAll('[data-screen]').forEach(b=>b.addEventListener('click',()=>{state.screen=b.dataset.screen;screen();persist();}));
 document.addEventListener('click',e=>panels.forEach(panel=>{if(!panel.contains(e.target)){panel.querySelector('.mn-category-panel').hidden=true;panel.querySelector('.mn-category,.mn-more').setAttribute('aria-expanded','false');}}));
 window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState;if(!s)return;state.screen=s.privateContent?.screen==='phone'?'phone':'desktop';Object.assign(state.selections,s.modelContent?.selections||{});screen();panels.forEach(render);});
 screen();
})();
</script>
